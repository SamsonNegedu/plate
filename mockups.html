<meta charset="utf-8">
<title>Plate mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="web/src/styles/tokens.css">

<style>
  @font-face {
    font-family: "Barlow";
    font-weight: 400;
    font-display: swap;
    src: url("fonts/barlow-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow";
    font-weight: 500;
    font-display: swap;
    src: url("fonts/barlow-500.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow";
    font-weight: 600;
    font-display: swap;
    src: url("fonts/barlow-600.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow";
    font-weight: 700;
    font-display: swap;
    src: url("fonts/barlow-700.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 500;
    font-display: swap;
    src: url("fonts/barlow-condensed-500.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 600;
    font-display: swap;
    src: url("fonts/barlow-condensed-600.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 700;
    font-display: swap;
    src: url("fonts/barlow-condensed-700.woff2") format("woff2");
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 26px 60px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  .board { max-width: 1180px; margin: 0 auto; }

  .masthead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand h1 {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(44px, 7vw, 64px);
    font-weight: 600;
    line-height: 0.9;
    letter-spacing: -0.01em;
  }

  .brand h1 span { color: var(--accent); }

  .brand .tag {
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.01em;
  }

  .masthead p {
    max-width: 46ch;
    margin: 12px 0 0;
    color: var(--ink-2);
    font-size: 14.5px;
    line-height: 1.55;
  }

  .theme-btn {
    flex: none;
    min-height: 36px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }

  .theme-btn:hover { border-color: var(--ink-3); color: var(--ink); }

  .palette {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px 18px;
    padding: 14px 0 0;
    font-size: 11.5px;
    color: var(--ink-2);
  }

  .palette span { display: inline-flex; align-items: center; gap: 6px; }

  .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.12);
    flex: none;
  }

  .screens {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
    justify-content: center;
    gap: 44px 30px;
    padding-top: 40px;
  }

  .mock { margin: 0; display: flex; flex-direction: column; gap: 14px; }

  .phone {
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
    aspect-ratio: 320 / 686;
    padding: 7px;
    border-radius: 36px;
    background: var(--frame);
    box-shadow: var(--shadow);
    border: 1px solid var(--frame-line);
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 29px;
    background: var(--surface);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.4;
  }

  figcaption strong {
    display: block;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.005em;
  }

  figcaption span {
    display: block;
    margin-top: 2px;
    color: var(--ink-2);
    font-size: 12.5px;
  }

  /* ----- shared mock chrome ----- */
  .statusbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 0;
    color: var(--ink-2);
    font-size: 9.5px;
    font-weight: 500;
  }

  .signal {
    display: flex;
    align-items: flex-end;
    gap: 1.5px;
    height: 8px;
  }

  .signal i {
    display: block;
    width: 2.5px;
    border-radius: 1px;
    background: currentColor;
  }

  .signal i:nth-child(1) { height: 3px; }
  .signal i:nth-child(2) { height: 5px; }
  .signal i:nth-child(3) { height: 7px; }
  .signal i:nth-child(4) { height: 8px; opacity: 0.35; }

  .mockbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 14px 4px;
  }

  .mockbar .word {
    font-family: var(--display);
    font-size: 21px;
    font-weight: 600;
    line-height: 1;
  }

  .mockbar .word span { color: var(--accent); }

  .mockbar svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--ink-3);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .screen svg.icon {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  .s-body {
    flex: 1;
    min-height: 0;
    padding: 0 14px 14px;
    overflow: hidden;
  }

  .s-daynav {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 0 8px;
  }

  .s-daynav div { flex: 1; text-align: center; }

  .s-daynav h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
  }

  .s-daynav p {
    margin: 1px 0 0;
    font-size: 9.5px;
    color: var(--ink-2);
  }

  .s-iconbtn {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    color: var(--ink-2);
  }

  .s-card {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .s-summary {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .s-big {
    font-family: var(--display);
    font-size: 52px;
    font-weight: 600;
    line-height: 0.82;
    letter-spacing: -0.015em;
  }

  .s-cap {
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-2);
  }

  .s-side {
    display: flex;
    gap: 12px;
    padding-top: 2px;
  }

  .s-side div { text-align: right; }

  .s-side span {
    display: block;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .s-side strong {
    font-family: var(--display);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.2;
  }

  .s-meter {
    position: relative;
    height: 7px;
    margin-top: 13px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .s-meter i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
  }

  .s-meter::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to right, transparent 0 calc(10% - 1px), var(--surface) calc(10% - 1px) 10%);
  }

  .s-macros {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 11px;
  }

  .s-macros span {
    display: flex;
    justify-content: space-between;
    gap: 2px;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .s-macros b { font-weight: 500; color: var(--ink); }

  .s-mini {
    height: 2px;
    margin-top: 3px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .s-mini i {
    display: block;
    height: 100%;
    background: var(--ink-3);
  }

  .s-cta {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    margin: 9px 0 2px;
  }

  .s-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font-size: 10.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .s-btn.primary {
    border-color: transparent;
    background: var(--accent);
    color: var(--on-accent);
  }

  .s-meal { margin-top: 10px; }

  .s-mealhead {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-bottom: 4px;
    border-bottom: 1.5px solid var(--ink);
  }

  .s-mealhead h3 {
    margin: 0;
    font-size: 10.5px;
    font-weight: 600;
  }

  .s-mealhead span {
    margin-left: auto;
    font-size: 9px;
    color: var(--ink-2);
  }

  .s-mealhead .plus {
    width: 18px;
    text-align: center;
    font-size: 14px;
    line-height: 1;
    color: var(--ink);
  }

  .s-entry {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 37px;
    border-bottom: 1px solid var(--line);
  }

  .s-thumb {
    width: 25px;
    height: 25px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 5px;
    background: var(--surface-2);
    color: var(--ink-3);
  }

  .s-thumb svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
  }

  .s-entry-text { flex: 1; min-width: 0; }

  .s-entry-text strong {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .s-entry-text span {
    display: block;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .s-entry b {
    font-size: 10.5px;
    font-weight: 600;
  }

  .s-empty {
    padding: 9px 0 3px;
    font-size: 9.5px;
    color: var(--ink-3);
  }

  /* ----- scan ----- */
  .scan-screen { background: #0d100c; color: #eef1e7; }

  .scan-screen .statusbar { color: #a9b0a1; }

  .scan-screen .mockbar .word { color: #eef1e7; }

  .scan-screen .mockbar svg { stroke: #8e9784; }

  .scan-title { padding: 3px 0 8px; }

  .scan-title h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .scan-title p {
    margin: 3px 0 0;
    font-size: 9.5px;
    color: #9aa392;
    max-width: 30ch;
  }

  .camera {
    position: relative;
    flex: 1;
    min-height: 0;
    margin: 0 14px;
    border-radius: 13px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 30% at 22% 26%, rgba(116, 140, 96, 0.5), transparent 70%),
      radial-gradient(ellipse 50% 26% at 78% 18%, rgba(160, 148, 100, 0.36), transparent 70%),
      radial-gradient(ellipse 70% 40% at 55% 72%, rgba(66, 88, 62, 0.6), transparent 72%),
      linear-gradient(165deg, #2a3126 0%, #1a201a 55%, #11150f 100%);
  }

  .camera::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.07), transparent 12%),
      radial-gradient(circle at 70% 45%, rgba(255, 255, 255, 0.05), transparent 9%),
      radial-gradient(circle at 45% 75%, rgba(255, 255, 255, 0.04), transparent 8%);
    filter: blur(2px);
  }

  .reticle {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 50%;
    height: 30%;
    transform: translateY(-50%);
    border: 1px dashed rgba(255, 255, 255, 0.45);
    border-radius: 10px;
  }

  .reticle::after {
    content: "";
    position: absolute;
    left: 4%;
    right: 4%;
    top: 50%;
    height: 1px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }

  .scan-status {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(6, 8, 5, 0.7);
    color: #f0f2ea;
    font-size: 8.5px;
    white-space: nowrap;
  }

  .scan-actions {
    display: flex;
    gap: 6px;
    padding: 9px 14px 0;
  }

  .scan-actions .s-btn {
    flex: 1;
    background: #1c2119;
    border-color: #333a2f;
    color: #e9ecdf;
    font-size: 9.5px;
  }

  .scan-note {
    padding: 8px 14px 0;
    font-size: 8.5px;
    line-height: 1.5;
    color: #8e9784;
  }

  /* ----- product sheet ----- */
  .sheet-screen { background: var(--surface-2); }

  .sheet-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--scrim);
    z-index: 1;
  }

  .sheet-backdrop {
    position: absolute;
    inset: 0;
    padding: 26px 16px 0;
    opacity: 0.5;
    filter: blur(0.4px);
  }

  .sheet-backdrop .fake-line {
    height: 9px;
    margin-bottom: 8px;
    border-radius: 4px;
    background: var(--ink-3);
  }

  .sheet-backdrop .fake-line.w60 { width: 60%; }
  .sheet-backdrop .fake-line.w80 { width: 80%; }
  .sheet-backdrop .fake-line.w40 { width: 40%; }

  .sheet-backdrop .fake-card {
    height: 78px;
    margin: 14px 0;
    border-radius: 12px;
    background: var(--surface);
  }

  .sheet-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    max-height: 84%;
    display: flex;
    flex-direction: column;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    border-radius: 16px 16px 0 0;
    background: var(--surface);
    box-shadow: 0 -10px 30px rgba(10, 13, 8, 0.28);
    overflow: hidden;
  }

  .grab {
    width: 32px;
    height: 3px;
    margin: 0 auto 8px;
    border-radius: 999px;
    background: var(--line);
    flex: none;
  }

  .p-head {
    display: flex;
    gap: 9px;
    align-items: flex-start;
  }

  .p-img {
    width: 56px;
    height: 56px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink-3);
  }

  .p-img svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; }

  .p-title { flex: 1; min-width: 0; }

  .p-title h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.15;
  }

  .p-title .brandline {
    margin-top: 2px;
    font-size: 9px;
    color: var(--ink-2);
  }

  .p-title .code {
    margin-top: 3px;
    font-family: var(--display);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ink-3);
  }

  .grade {
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
    margin-top: 3px;
    border-radius: 4px;
    background: #c0392b;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
  }

  .p-close {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    font-size: 14px;
    line-height: 1;
  }

  .nutri {
    margin: 9px 0 0;
    border-top: 1.5px solid var(--ink);
    border-bottom: 1.5px solid var(--ink);
  }

  .nutri-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 4px 0 3px;
    border-bottom: 1px solid var(--ink);
  }

  .nutri-head span { font-size: 8.5px; color: var(--ink-2); }

  .nutri-head strong {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 600;
    line-height: 1;
  }

  .nutri-head small {
    font-family: var(--font);
    font-size: 8px;
    font-weight: 400;
    color: var(--ink-2);
  }

  .nutri-row {
    display: flex;
    justify-content: space-between;
    padding: 3.5px 0;
    border-bottom: 1px solid var(--line);
    font-size: 9px;
  }

  .nutri-row:last-child { border-bottom: 0; }

  .nutri-row span:first-child { color: var(--ink-2); }
  .nutri-row span:last-child { font-weight: 500; }
  .nutri-row.indent span:first-child { padding-left: 8px; }

  .amount-mock {
    display: flex;
    align-items: center;
    margin-top: 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
  }

  .amount-mock span {
    width: 30px;
    height: 34px;
    display: grid;
    place-items: center;
    color: var(--ink);
    font-size: 13px;
  }

  .amount-mock strong {
    flex: 1;
    text-align: center;
    font-family: var(--display);
    font-size: 18px;
    font-weight: 600;
    line-height: 34px;
  }

  .amount-mock em {
    font-style: normal;
    padding-right: 4px;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .chips {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }

  .chip {
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .meal-seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    margin-top: 9px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
  }

  .meal-seg span {
    padding: 4px 0;
    border-radius: 6px;
    text-align: center;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .meal-seg span.on { background: var(--surface); color: var(--ink); font-weight: 500; }

  .total-mock {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 9px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
  }

  .total-mock strong {
    font-family: var(--display);
    font-size: 24px;
    font-weight: 600;
    line-height: 1;
  }

  .total-mock strong small {
    font-family: var(--font);
    font-size: 8.5px;
    font-weight: 400;
    color: var(--ink-2);
  }

  .total-mock span {
    font-size: 8.5px;
    color: var(--ink-2);
    text-align: right;
    line-height: 1.35;
  }

  .sheet-panel .s-btn { width: 100%; margin-top: 8px; min-height: 32px; }

  /* ----- history ----- */
  .h-title {
    padding: 2px 0 7px;
  }

  .h-title h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .h-title p { margin: 2px 0 0; font-size: 9px; color: var(--ink-2); }

  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
  }

  .seg span {
    padding: 4px 0;
    border-radius: 6px;
    text-align: center;
    font-size: 8.5px;
    color: var(--ink-2);
  }

  .seg span.on { background: var(--surface); color: var(--ink); font-weight: 500; }

  .chart-card-mock {
    margin-top: 8px;
    padding: 9px 9px 6px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
  }

  .chart-card-mock .chart-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }

  .chart-card-mock h3 { margin: 0; font-size: 9.5px; font-weight: 600; }
  .chart-card-mock .goal-note { font-size: 8px; color: var(--ink-2); }

  .chart-card-mock svg { display: block; width: 100%; height: auto; }

<script>
  (() => {
    const btn = document.getElementById('themeBtn');
    const isDark = () =>
      document.documentElement.dataset.theme
        ? document.documentElement.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
    const label = () => { btn.textContent = isDark() ? 'Light mode' : 'Dark mode'; };
    btn.addEventListener('click', () => {
      document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
      label();
    });
    label();
  })();
</script>
