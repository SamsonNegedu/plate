# The app publishes no port. Put it behind your own proxy or tunnel.
services:
  plate:
    # Production only pulls. To build from source instead, add compose.build.yaml (see the README).
    image: ghcr.io/samsonnegedu/plate:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PLATE_BASE_URL: ${PLATE_BASE_URL:?set the public https URL}
      PLATE_SIGNUP_ENABLED: ${PLATE_SIGNUP_ENABLED:-true}
      PLATE_LOG_LEVEL: ${PLATE_LOG_LEVEL:-info}
      PLATE_OFF_USER_AGENT: ${PLATE_OFF_USER_AGENT:-Plate/1.0 (self-hosted)}
      PLATE_SYNC_ENABLED: ${PLATE_SYNC_ENABLED:-true}
      # The bundled /seed/off-catalog.db is imported when the catalog is empty or the seed's dataset version is newer.
      PLATE_CATALOG_REIMPORT: ${PLATE_CATALOG_REIMPORT:-false}
    volumes:
      - plate-data:/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/plate", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  internal: {}

volumes:
  plate-data: {}
