# The app publishes no port. Put it behind your own proxy or tunnel.
services:
  plate:
    # Pull a released image, or build from source with `docker compose up -d --build`.
    image: ghcr.io/samsonnegedu/plate:latest
    build: .
    restart: unless-stopped
    environment:
      PLATE_BASE_URL: ${PLATE_BASE_URL:?set the public https URL}
      PLATE_ADMIN_EMAIL: ${PLATE_ADMIN_EMAIL:-}
      PLATE_ADMIN_PASSWORD: ${PLATE_ADMIN_PASSWORD:-}
      PLATE_LOG_LEVEL: ${PLATE_LOG_LEVEL:-info}
      PLATE_OFF_USER_AGENT: ${PLATE_OFF_USER_AGENT:-Plate/1.0 (self-hosted)}
      PLATE_SYNC_ENABLED: ${PLATE_SYNC_ENABLED:-true}
      PLATE_ADMIN_RESET_PASSWORD: ${PLATE_ADMIN_RESET_PASSWORD:-false}
      # The bundled /seed/off-catalog.db is imported when the catalog is empty.
      PLATE_CATALOG_REIMPORT: ${PLATE_CATALOG_REIMPORT:-false}
    volumes:
      - plate-data:/data
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/plate", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  internal: {}

volumes:
  plate-data: {}
