name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

# Every job starts at once, so wall time is the slowest job, not the sum. Playwright (`make test-e2e`) runs locally only.
jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go test ./...

  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Prebuilt tools: `go run` would compile golangci-lint and sqlc from source on every run. Versions match go.mod.
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.30.0" }
      - run: make sqlc-diff SQLC=sqlc

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - run: make audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: ./.github/actions/setup-web
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.30.0" }
      - run: make generate SQLC=sqlc
      - name: Generated files are committed
        run: git diff --exit-code -- db internal web/src/api docs/api.md

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: ./.github/actions/setup-web
      - run: make build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: ref
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # registry names must be lowercase
      # Pull requests: one amd64 image, loaded locally for the smoke test.
      - if: env.PUSH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # main: build amd64 and arm64 together (the Go stage cross-compiles, so there is no emulation) and push the
      # result as sha-<commit>. That tag is a candidate only; nothing deploys it. `publish` promotes it to latest once
      # every other job is green.
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          if [ "$PUSH" = true ]; then image="${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}"; else image=plate:smoke; fi
          scripts/docker-smoke.sh "$image"

  # Only main publishes `latest`, and only after every job above passed, so `latest` is always a tested build.
  # The image was built and smoke-tested once, in `docker`; this just moves the tag.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-test, go-lint, audit, web, generated, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}" # registry names must be lowercase
          docker buildx imagetools create --tag "$image:latest" "$image:sha-${GITHUB_SHA::7}"
