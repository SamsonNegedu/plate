name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

# Every job starts at once; only e2e waits, for the binary that `build` produces. Wall time is the slowest path
# (build then e2e), not the sum of all jobs.
jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go test ./...

  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Prebuilt tools: `go run` would compile golangci-lint and sqlc from source on every run. Versions match go.mod.
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.30.0" }
      - run: make sqlc-diff SQLC=sqlc

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - run: make audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: ./.github/actions/setup-web
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.30.0" }
      - run: make generate SQLC=sqlc
      - name: Generated files are committed
        run: git diff --exit-code -- db internal web/src/api docs/api.md

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: ./.github/actions/setup-web
      - run: make build
      # Same flags as make build, so the compiled dependencies are reused instead of rebuilt.
      - run: go build -trimpath -ldflags="-s -w" -o bin/e2eseed ./tools/e2eseed
      - uses: actions/upload-artifact@v4
        with:
          name: plate-linux-amd64
          path: |
            bin/plate
            bin/e2eseed
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-400, desktop] # each project gets its own server and user, so they run side by side
        shard: [1, 2] # half of the tests each; setup signs in once per shard
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v4
        with: { name: plate-linux-amd64, path: bin }
      - run: chmod +x bin/plate bin/e2eseed
      - id: playwright
        run: echo "version=$(pnpm --dir web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image already carries Chrome's system libraries, so a cached browser needs no apt step.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/docker-smoke.sh plate:smoke
      # On main, the image that just passed the smoke test is pushed as sha-<commit>. That tag is a candidate only;
      # nothing deploys it. `publish` promotes it to latest once every other job is green.
      - id: short
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # registry names must be lowercase
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.short.outputs.image }}:sha-${{ steps.short.outputs.sha }}
          cache-from: type=gha

  # Only main publishes `latest`, and only after every job above passed, so `latest` is always a tested build.
  # The image was built and smoke-tested once, in `docker`; this just moves the tag.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-test, go-lint, audit, web, generated, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}" # registry names must be lowercase
          docker buildx imagetools create --tag "$image:latest" "$image:sha-${GITHUB_SHA::7}"
