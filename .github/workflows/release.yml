name: release
# Tag vX.Y.Z to publish ghcr.io/<owner>/plate:X.Y.Z (and :X.Y for a stable tag) after the smoke test passes, so a
# version can be pinned for a rollback. `latest` is published by ci.yml on every green push to main, not here.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build once and smoke-test it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/docker-smoke.sh plate:smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
