version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - nilerr
    - sqlclosecheck
    - rowserrcheck
    - misspell
  settings:
    misspell:
      # "apon" is the Yoruba name for ogbono, not a typo of "upon".
      ignore-rules: [apon]
    gosec:
      excludes:
        - G104
  exclusions:
    paths:
      - internal/store/sqlc
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
