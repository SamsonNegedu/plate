version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - nilerr
    - sqlclosecheck
    - rowserrcheck
    - misspell
  settings:
    gosec:
      excludes:
        - G104
  exclusions:
    paths:
      - internal/store/sqlc
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
